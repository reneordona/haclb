<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3600">
<title>Quote of the Day — Poster Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600&family=Satisfy&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan:       #05c3de;
    --cyan-deep:  #04aac2;
    --teal-ink:   #043642;
    --white:      #ffffff;
    --cream:      #fdfdf8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #032a33;
    font-family: 'Archivo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #scaler {
    position: fixed;
    top: 0; left: 0;
    width: 1280px; height: 720px;
    transform-origin: top left;
  }

  .canvas {
    width: 1280px; height: 720px;
    position: relative; overflow: hidden;
    background: var(--cyan);
  }

  /* Halftone dot field, lower-right */
  .halftone {
    position: absolute; z-index: 1;
    right: -60px; bottom: -60px;
    width: 520px; height: 400px;
    background-image: radial-gradient(circle, var(--cyan-deep) 2.6px, transparent 2.6px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse at bottom right, #000 30%, transparent 72%);
    mask-image: radial-gradient(ellipse at bottom right, #000 30%, transparent 72%);
    pointer-events: none;
  }

  /* Giant outlined quotation mark, upper right */
  .big-mark {
    position: absolute; z-index: 1;
    top: -60px; right: 64px;
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 380px; line-height: 1;
    color: transparent;
    -webkit-text-stroke: 3px rgba(255,255,255,0.5);
    user-select: none;
    pointer-events: none;
  }

  /* ── Masthead ── */
  .masthead {
    position: absolute; z-index: 3;
    top: 52px; left: 72px;
  }
  .masthead-title {
    font-size: 21px; font-weight: 900;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--teal-ink);
    line-height: 1;
  }
  .masthead-bar {
    margin-top: 10px;
    width: 78px; height: 8px;
    background: var(--white);
  }

  /* Sticker date badge */
  .badge {
    position: absolute; z-index: 3;
    top: 46px; right: 72px;
    background: var(--white);
    color: var(--teal-ink);
    padding: 13px 22px 12px;
    font-size: 13px; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase;
    transform: rotate(-2.5deg);
    box-shadow: 5px 6px 0 var(--teal-ink);
  }

  /* ── Quote ── */
  .container {
    position: absolute; z-index: 3;
    left: 72px; right: 110px;
    top: 52%; transform: translateY(-50%);
    opacity: 0;
    animation: stamp 0.7s cubic-bezier(0.34,1.4,0.5,1) forwards 0.25s;
  }

  .quote-text {
    font-family: 'Satisfy', cursive;
    font-weight: 400;
    line-height: 1.32;
    letter-spacing: 0.005em;
    color: var(--white);
    text-shadow: 0 3px 22px rgba(4,54,66,0.3);
    margin-bottom: 34px;
  }
  .quote-text.q-short { font-size: 78px; line-height: 1.2; }
  .quote-text.q-med   { font-size: 58px; }
  .quote-text.q-long  { font-size: 44px; line-height: 1.34; }

  .author-wrap {
    display: inline-flex; align-items: center;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards 1s;
  }
  .author-name {
    background: #f79f1b;
    color: var(--white);
    padding: 11px 20px 10px;
    font-size: 16px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .author-tab {
    width: 16px; height: 100%;
    align-self: stretch;
    background: var(--white);
  }

  .loading {
    font-size: 18px !important;
    font-weight: 600;
    font-style: italic;
    color: rgba(4,54,66,0.6);
  }

  /* Bottom strip */
  .strip {
    position: absolute; z-index: 3;
    left: 0; right: 0; bottom: 0;
    height: 46px;
    background: var(--teal-ink);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 72px;
  }
  .strip span {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  .strip .tick { color: var(--cyan); }

  @keyframes stamp {
    from { opacity: 0; transform: translateY(-50%) scale(0.96); }
    to   { opacity: 1; transform: translateY(-50%) scale(1); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div id="scaler">
<div class="canvas">

  <div class="halftone"></div>
  <div class="big-mark">&rdquo;</div>

  <div class="masthead">
    <div class="masthead-title">Quote of<br>the Day</div>
    <div class="masthead-bar"></div>
  </div>

  <div class="badge" id="dateLabel"></div>

  <div class="container" id="quoteContainer">
    <p class="quote-text loading" id="quoteText">Loading today's quote&hellip;</p>
    <div class="author-wrap" id="authorWrap" style="visibility:hidden;">
      <span class="author-tab" style="background: var(--teal-ink);"></span>
      <span class="author-name" id="authorName"></span>
    </div>
  </div>

  <div class="strip">
    <span>Housing Authority of the City of Long Beach</span>
  </div>

</div>
</div>

<script>

  // ─── Display the date ───
  function setDate() {
    const now = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dateLabel').textContent =
      now.toLocaleDateString('en-US', opts);
  }

  // ─── Pick a quote deterministically by day ───
  function getDailyFallback() {
    const now = new Date();
    const dayIndex = Math.floor(now.getTime() / 86400000);
    return FALLBACK_QUOTES[dayIndex % FALLBACK_QUOTES.length];
  }

  // ─── Size class by quote length so long quotes never overflow ───
  function sizeClass(t) {
    if (t.length < 70)  return 'q-short';
    if (t.length < 150) return 'q-med';
    return 'q-long';
  }

  // ─── Render quote ───
  function renderQuote(text, author) {
    const qEl = document.getElementById('quoteText');
    const aEl = document.getElementById('authorName');
    const wEl = document.getElementById('authorWrap');

    qEl.classList.remove('loading', 'error-state', 'q-short', 'q-med', 'q-long');
    qEl.classList.add(sizeClass(text));
    qEl.textContent = text;
    aEl.textContent = author || 'Unknown';
    wEl.style.visibility = 'visible';
  }

  // ─── Fetch from ZenQuotes with fallback ───
  async function loadQuote() {
    setDate();

    const today = new Date().toDateString();
    const cached = sessionStorage.getItem('qtd_date');
    if (cached === today) {
      const cq = sessionStorage.getItem('qtd_quote');
      const ca = sessionStorage.getItem('qtd_author');
      if (cq) { renderQuote(cq, ca); return; }
    }

    try {
      const res = await fetch('https://zenquotes.io/api/today', { mode: 'cors' });
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      if (data && data[0] && data[0].q && data[0].a) {
        const q = data[0].q;
        const a = data[0].a;
        sessionStorage.setItem('qtd_date', today);
        sessionStorage.setItem('qtd_quote', q);
        sessionStorage.setItem('qtd_author', a);
        renderQuote(q, a);
        return;
      }
    } catch (e) {
      // API unreachable — use fallback
    }

    const fb = getDailyFallback();
    renderQuote(fb.q, fb.a);
  }

  // ─── Init ───
  loadQuote();

  // Refresh at midnight
  function scheduleNextDay() {
    const now = new Date();
    const msUntilMidnight =
      new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
    setTimeout(() => {
      sessionStorage.clear();
      loadQuote();
      scheduleNextDay();
    }, msUntilMidnight);
  }
  scheduleNextDay();

  /* ─── Skykit scaling — do not modify ─── */
  (function () {
    var el = document.getElementById('scaler');
    function scale() {
      var sx = window.innerWidth  / 1280;
      var sy = window.innerHeight / 720;
      var s  = Math.min(sx, sy);
      var ox = (window.innerWidth  - 1280 * s) / 2;
      var oy = (window.innerHeight - 720  * s) / 2;
      el.style.transform = 'translate(' + ox + 'px, ' + oy + 'px) scale(' + s + ')';
    }
    scale();
    window.addEventListener('resize', scale);
  })();

</script>

</body>
</html>
